<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Worldmatters - Chatbot</title>

  <body class="h-screen flex flex-col bg-gradient-to-br from-blue-50 to-indigo-100">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 flex-shrink-0">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-blue-400 rounded-lg flex items-center justify-center">
              <i class="fa-solid fa-comment text-white"></i>
            </div>
            <h1 class="text-xl font-semibold text-gray-900">Chatbot</h1>
          </div>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="flex flex-col items-center justify-center min-h-[calc(100vh-4rem)] overflow-hidden p-4 mb-2 sm:p-6 lg:p-10 overflow-y-auto">
      {% block main %}{% endblock %}
    </main>
